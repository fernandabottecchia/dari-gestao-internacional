{% set color34=m._status_palette34 %}{% if color34 %}<span class="mobility29-badge custom-status34" style="display:inline-block;padding:4px 9px;border-radius:12px;border:1px solid {{ color34.border }};background:{{ color34.background }};color:{{ color34.foreground }}">{{ m.status or 'Sem classificação' }}</span>{% else %}<span class="mobility29-neutral">{{ 'Sem classificação' if (m.status or '')|lower=='ativo' else (m.status or 'Sem classificação') }}</span>{% endif %}
