{% extends "base.html" %}
{% block title %}DARI • Novo {{ direction }}{% endblock %}
{% block heading %}<h1>Novo {{ 'incoming' if direction=='incoming' else 'outgoing' }}</h1>{% endblock %}
{% block content %}
<form class="card form-grid" method="post">
<label>Nome completo<input name="name" required></label><label>E-mail<input type="email" name="email"></label>
<label>DRE<input name="dre"></label><label>Passaporte<input name="passport"></label>
<label>Curso<select name="course_id">{% for x in courses %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label>
<label>Programa/Projeto<select name="program_id">{% for x in programs %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label>
<label>Coordenador<select name="coordinator_id">{% for x in coordinators %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label>
<label>{{ 'Instituição de origem' if direction=='incoming' else 'Universidade de destino' }}<select name="university_id">{% for x in universities %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label>
<label>Semestre<input name="new_semester" required pattern="[0-9]{4}/[12]" maxlength="6" placeholder="Ex. 2029/2" title="Quatro algarismos, barra e 1 ou 2. Ex.: 2028/1"></label>
<label>Tipo de mobilidade<select name="mobility_type">{% for opt in mobility_type_options %}<option value="{{ opt }}" >{{ opt }}</option>{% endfor %}</select></label>
<label>Duração (semestres)<input type="number" min="1" max="8" name="duration_semesters" value="1"></label>
<label>Status<input name="status" value="Ativo"></label>
{% include "_editable_form_cards_v53_48_12.html" %}
<div class="form-actions"><a class="button" href="/{{direction}}">Cancelar</a><button class="primary" type="submit">Salvar</button></div>
</form>
{% endblock %}
