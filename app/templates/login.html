<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login • DARI</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-identity">
        <img src="/static/cabecalho_dari.jpg" alt="Escola Politécnica da UFRJ — Diretoria Adjunta de Relações Internacionais">
      </div>
      <div class="login-content">
        <div class="login-kicker">SISTEMA DARI</div>
        <h1>Gestão Internacional</h1>
        <p class="login-subtitle">Gestão de Incoming, Outgoing e Acordos Internacionais.</p>
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
        <form method="post" action="/login" class="login-form">
          <label>Usuário
            <input name="username" autocomplete="username" autofocus required>
          </label>
          <label>Senha
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary login-button" type="submit">Entrar</button>
        </form>

      </div>
    </section>
  </main>
</body>
</html>
